<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>《超时》数据看板</title>
<style>
  :root { --bg:#14161a; --card:#1c1f24; --line:#2c3038; --text:#e8e4dc; --dim:#9a958c; --accent:#c79a4b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:14px/1.7 -apple-system,"PingFang SC","Noto Sans SC",sans-serif; }
  header { padding:20px 28px; border-bottom:1px solid var(--line); display:flex;
           align-items:center; gap:16px; flex-wrap:wrap; }
  h1 { font-size:18px; margin:0; font-weight:600; letter-spacing:.04em; }
  .dim { color:var(--dim); font-size:12px; }
  main { padding:24px 28px 60px; max-width:1180px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .card .k { color:var(--dim); font-size:12px; }
  .card .v { font-size:24px; font-variant-numeric:tabular-nums; margin-top:4px; }
  h2 { font-size:14px; margin:28px 0 10px; color:var(--accent); font-weight:600; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:7px 10px; border-bottom:1px solid var(--line); }
  th { color:var(--dim); font-weight:500; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  .bar { height:6px; background:var(--accent); opacity:.55; border-radius:3px; }
  input { background:#0f1114; border:1px solid var(--line); color:var(--text);
          padding:6px 10px; border-radius:6px; }
  button { background:var(--accent); border:0; color:#14161a; padding:7px 14px;
           border-radius:6px; cursor:pointer; font-weight:600; }
  .note { color:var(--dim); font-size:12px; margin-top:8px; line-height:1.8; }
</style>
</head>
<body>
<header>
  <h1>《超时》数据看板</h1>
  <input id="token" placeholder="访问令牌" />
  <input id="days" type="number" min="1" max="365" value="30" style="width:78px" title="统计天数" />
  <button id="load">刷新</button>
  <span class="dim" id="stamp"></span>
</header>
<main>
  <div class="grid" id="cards"></div>
  <h2>章节到达</h2><table id="chapters"></table>
  <h2>选择分布</h2><table id="choices"></table>
  <h2>结局</h2><table id="endings"></table>
  <h2>站点与版本</h2><table id="sites"></table>
  <h2>按日 PV</h2><table id="daily"></table>
  <h2>章节快跳（从目录进入）</h2><table id="jumps"></table>
  <p class="note">
    UV = 匿名浏览器标识数量，不等于真实人数；各部署域名存储独立，分站统计不做去重。<br />
    默认排除标记为测试的流量；跳到后期章节不计入前序章节完成；ending_enter 与 ending_complete 分开统计。
  </p>
</main>
<script>
const $ = id => document.getElementById(id);
const pct = (a, b) => b ? Math.round(a / b * 100) + '%' : '-';
const Q = new URLSearchParams(location.search);
// Worker 托管时同源；从 Pages / GitHub Pages 打开时指向 Worker
const API = Q.get('api') ||
  (/\.workers\.dev$/.test(location.hostname) ? '' : 'https://chaoshi-analytics.gong7968.workers.dev');

function table(el, rows, cols) {
  if (!rows || !rows.length) { el.innerHTML = '<tr><td class="dim">暂无数据</td></tr>'; return; }
  const max = Math.max(...rows.map(r => r[1]));
  el.innerHTML = '<tr><th>' + cols[0] + '</th><th>' + cols[1] + '</th><th></th></tr>' +
    rows.map(r => `<tr><td>${r[0] ?? '-'}</td><td class="num">${r[1]}</td>
      <td style="width:40%"><div class="bar" style="width:${max ? r[1] / max * 100 : 0}%"></div></td></tr>`).join('');
}

async function load() {
  const token = $('token').value || Q.get('token') || '';
  localStorage.setItem('chaoshi_dash_token', token);
  const days = $('days').value || '30';
  const r = await fetch(API + '/api/stats?token=' + encodeURIComponent(token) + '&days=' + days);
  if (!r.ok) { $('stamp').textContent = r.status === 401 ? '令牌无效' : '读取失败'; return; }
  const d = await r.json();
  const cards = [
    ['页面访问 PV', d.pv], ['匿名访问 UV', d.uv], ['会话数', d.sessions],
    ['开始游玩的局数', d.runs], ['加载完成', d.ready],
    ['首屏 P50', d.ready_p50_ms ? d.ready_p50_ms + ' ms' : '-'],
    ['首屏 P95', d.ready_p95_ms ? d.ready_p95_ms + ' ms' : '-'],
    ['错误事件', d.errors],
    ['章节读完次数', d.chapter_done], ['结局完成次数', d.endings_done],
  ];
  $('cards').innerHTML = cards.map(([k, v]) =>
    `<div class="card"><div class="k">${k}</div><div class="v">${v ?? '-'}</div></div>`).join('');
  table($('chapters'), d.chapters, ['章节', '到达次数']);
  table($('choices'), d.choices, ['选择 / 选项', '次数']);
  table($('endings'), d.endings, ['结局', '完成次数']);
  table($('sites'), d.sites, ['站点', 'PV']);
  table($('daily'), d.daily, ['日期', 'PV']);
  table($('jumps'), d.jumps, ['跳到章节', '次数']);
  $('stamp').textContent = '事件 ' + d.events + ' 条 · 近 ' + (d.days || days) + ' 天 · 版本 ' +
    (d.builds && d.builds.length ? d.builds.map(b => b[0]).join(', ') : '-');
}

$('token').value = Q.get('token') || localStorage.getItem('chaoshi_dash_token') || '';
$('days').value = Q.get('days') || localStorage.getItem('chaoshi_dash_days') || '30';
$('days').onchange = () => localStorage.setItem('chaoshi_dash_days', $('days').value);
$('load').onclick = () => { localStorage.setItem('chaoshi_dash_days', $('days').value); load(); };
load();
</script>
</body>
</html>
